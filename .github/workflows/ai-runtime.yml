name: Merge AI Runtime

on:
  push:
    paths:
      - 'ai/**'
      - '.github/workflows/ai-runtime.yml'
  pull_request:
    paths:
      - 'ai/**'
      - '.github/workflows/ai-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile runtime Python
        run: python -m compileall -q ai/runtime

      - name: Run runtime safety tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q ai/tests

      - name: Verify no real API keys are present
        shell: bash
        run: |
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|xai-[A-Za-z0-9_-]{20,})' ai .env* 2>/dev/null; then
            echo 'Potential API credential detected in tracked runtime files.'
            exit 1
          fi
